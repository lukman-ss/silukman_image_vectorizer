name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test OS=${{ matrix.os }} Python=${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[all]
          if [ "$RUNNER_OS" == "Linux" ]; then sudo apt-get update && sudo apt-get install -y libegl1 xvfb; fi
        shell: bash

      - name: Lint
        run: |
          flake8 app benchmark tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Unit and Integration Tests
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            xvfb-run -a python -m pytest tests/core tests/integration/test_vectorization.py tests/integration/test_regression.py -v
          else
            python -m pytest tests/core tests/integration/test_vectorization.py tests/integration/test_regression.py -v
          fi
        shell: bash

      - name: CLI Smoke Test
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            xvfb-run -a python -m pytest tests/integration/test_cli.py -v
          else
            python -m pytest tests/integration/test_cli.py -v
          fi
        shell: bash

      - name: Benchmark Smoke Test
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            xvfb-run -a python -m pytest tests/integration/test_benchmark_smoke.py -v
          else
            python -m pytest tests/integration/test_benchmark_smoke.py -v
          fi
        shell: bash

  build:
    name: Package Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install build
      - name: Build package
        run: |
          python -m build

  research-validation:
    name: Research Artifacts Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install pyyaml
          
      - name: Validate Research Schemas
        run: |
          python scripts/validate_research_artifacts.py
