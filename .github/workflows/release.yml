name: Publish Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test:
    name: Run Tests Before Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run Tests
        run: |
          PYTHONPATH=. pytest tests/ -v

  build:
    name: Build Release on ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            artifact_name: Image-Vectorizer-Windows
            archive_format: zip
          - os: macos-latest
            artifact_name: Image-Vectorizer-macOS
            archive_format: zip
          - os: ubuntu-latest
            artifact_name: Image-Vectorizer-Linux
            archive_format: tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Build Script
        run: |
          python scripts/build_app.py

      - name: Verify Build Deliverables
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            if [ ! -f "dist/Image Vectorizer/Image Vectorizer.exe" ]; then exit 1; fi
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            if [ ! -d "dist/Image Vectorizer.app" ]; then exit 1; fi
          else
            if [ ! -f "dist/Image Vectorizer/Image Vectorizer" ]; then exit 1; fi
          fi

      - name: Archive Build Artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Image Vectorizer" -DestinationPath "${{ matrix.artifact_name }}.zip"
          $hash = (Get-FileHash "${{ matrix.artifact_name }}.zip" -Algorithm SHA256).Hash
          echo "$hash  ${{ matrix.artifact_name }}.zip" > "${{ matrix.artifact_name }}.zip.sha256"

      - name: Archive Build Artifact (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          cd dist
          zip -r ../${{ matrix.artifact_name }}.zip "Image Vectorizer.app"
          cd ..
          shasum -a 256 "${{ matrix.artifact_name }}.zip" > "${{ matrix.artifact_name }}.zip.sha256"

      - name: Archive Build Artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cd dist
          tar -czf ../${{ matrix.artifact_name }}.tar.gz "Image Vectorizer"
          cd ..
          sha256sum "${{ matrix.artifact_name }}.tar.gz" > "${{ matrix.artifact_name }}.tar.gz.sha256"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.${{ matrix.archive_format }}
            ${{ matrix.artifact_name }}.${{ matrix.archive_format }}.sha256
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Image-Vectorizer-Windows

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: Image-Vectorizer-macOS

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: Image-Vectorizer-Linux

      - name: Create Source Archive
        run: |
          git archive -o source_code.tar.gz HEAD
          git archive -o source_code.zip HEAD
          sha256sum source_code.tar.gz > source_code.tar.gz.sha256
          sha256sum source_code.zip > source_code.zip.sha256

      - name: Extract Release Notes
        id: release_notes
        shell: bash
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          echo "Extracting release notes for tag: $TAG_VERSION"
          if [ -f "CHANGELOG.md" ]; then
            # Basic extraction (first section after the tag)
            sed -n "/^## \[$TAG_VERSION\]/,/^## \[/p" CHANGELOG.md | sed '$d' > release_notes.txt
            if [ ! -s release_notes.txt ]; then
              echo "Release $TAG_VERSION" > release_notes.txt
            fi
          else
            echo "Release $TAG_VERSION" > release_notes.txt
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: release_notes.txt
          draft: false
          prerelease: false
          files: |
            Image-Vectorizer-Windows.zip
            Image-Vectorizer-Windows.zip.sha256
            Image-Vectorizer-macOS.zip
            Image-Vectorizer-macOS.zip.sha256
            Image-Vectorizer-Linux.tar.gz
            Image-Vectorizer-Linux.tar.gz.sha256
            source_code.tar.gz
            source_code.tar.gz.sha256
            source_code.zip
            source_code.zip.sha256
