experiment:
  id: benchmark-v1
  repetitions: 3
  warmup_runs: 1
  timeout_seconds: 60
  dataset_role: "evaluation"
  experiment_role: "full_benchmark"
  publication_eligible: true

dataset:
  manifest: benchmark/datasets/real_world/dataset_manifest.csv
  split: test
  categories:
    - logo
    - binary_graphic

backends:
  - silukman
  - vtracer

presets:
  - low_complexity
  - balanced

metrics:
  - mae
  - ssim
  - edge_f1
  - svg_complexity
