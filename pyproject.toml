[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silukman-image-vectorizer"
version = "1.20.0"
description = "A PySide6 desktop application for high-quality raster-to-vector (SVG) conversion."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Lukman-ss" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "PySide6>=6.0.0",
    "pillow>=9.0.0",
    "opencv-python>=4.5.0",
    "numpy>=1.20.0",
    "vtracer>=0.1.6",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
research = [
    "scikit-image>=0.19.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "scipy>=1.9.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
    "build>=1.0.0",
    "pyinstaller>=6.0.0",
]
all = [
    "scikit-image>=0.19.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "scipy>=1.9.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
    "build>=1.0.0",
    "pyinstaller>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/lukman-ss/silukman_image_vectorizer"
Bug-Tracker = "https://github.com/lukman-ss/silukman_image_vectorizer/issues"

[project.scripts]
image-vectorizer = "app.cli:main"
silukman-vectorizer = "app.cli_headless:main"

[tool.setuptools]
packages = ["app", "app.config", "app.core", "app.resources", "app.services", "app.ui"]

[tool.setuptools.package-data]
"app.resources" = ["*.png", "*.icns"]

[tool.setuptools.exclude-package-data]
"*" = ["build*", "dist*", "samples*", "docs*"]

[tool.pytest.ini_options]
addopts = "--cov=app --cov=benchmark --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app", "benchmark"]
omit = [
    "app/ui/*",
    "app/cli.py",
    "benchmark/analysis/plot_generator.py",
    "benchmark/analysis/table_generator.py",
    "benchmark/analysis/report_generator.py",
    "app/resources/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "except ImportError:"
]

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
